# Override opcional para usar la GPU NVIDIA desde el Ollama de Docker.
#
# No se aplica por defecto: `make up`, `make prod-up`, `make prod-bootstrap` y
# `deploy.sh` (CD) lo añaden cuando `scripts/gpu-detect.sh` encuentra driver
# NVIDIA y NVIDIA Container Toolkit. Si falta algo, o con `OLLAMA_GPU=0`, el
# stack arranca en CPU. `make gpu-check` muestra la decisión.
#
# Uso manual:
#   docker compose -f compose.yml -f compose.gpu.yml --profile full up -d
#   docker compose -f compose.prod.yml -f compose.gpu.yml up -d
#
# Requiere NVIDIA Container Toolkit y el runtime configurado:
#   sudo apt-get install -y nvidia-container-toolkit
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
