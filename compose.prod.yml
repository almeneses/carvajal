# App web + Postgres 16 + Qdrant + Ollama para una sola máquina (demo por IP).
#
#   cp .env.example .env   # edita SESSION_SECRET, POSTGRES_PASSWORD...
#   APP_PORT=8080 docker compose -f compose.prod.yml up -d --build
#   docker compose -f compose.prod.yml run --rm app alembic upgrade head
#   docker compose -f compose.prod.yml logs -f app
#
# Compose falla si falta SESSION_SECRET: una clave HMAC conocida permitiría
# falsificar la cookie del visitante. En producción no se construye la imagen
# en el VPS: `scripts/deploy.sh` la descarga de GHCR con un tag inmutable.
#
# Este compose no incluye proxy TLS: publica la app en 0.0.0.0:APP_PORT
# (8080 por defecto) para una demo por IP. Si más adelante pones un dominio,
# añade nginx/Caddy delante y publica la app solo en 127.0.0.1.
#
# El runbook completo (VPS, secretos, primer despliegue y rollback) está en
# `docs/despliegue-ovh.md`.

name: carvajal-prod

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carvajal}
      # Cámbiala en el .env del servidor: el valor por defecto es de desarrollo.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carvajal}
      POSTGRES_DB: ${POSTGRES_DB:-carvajal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
    # En producción `deploy.sh` exporta APP_IMAGE con el tag SHA de GHCR; en
    # local se mantiene el nombre que construye `make prod-up`.
    image: ${APP_IMAGE:-carvajal-api:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        # El embedder se crea en la primera pregunta, no al arrancar: la app
        # puede iniciar aunque Ollama aún esté calentando. Los modelos se
        # descargan con `make prod-bootstrap` (perfil `bootstrap`).
        condition: service_started
    # Las variables se comparten con el servicio `bootstrap` de abajo.
    environment: &app-environment
      # Dentro de la red de compose el host de la base es el servicio `db`,
      # no loopback: por eso la URL se compone aquí a partir de POSTGRES_*.
      DATABASE_URL: postgresql://${POSTGRES_USER:-carvajal}:${POSTGRES_PASSWORD:-carvajal}@db:5432/${POSTGRES_DB:-carvajal}
      # Versión del aprovisionamiento comercial (captura más reciente del
      # catálogo/precios). El bootstrap falla si no coincide con `version`.
      EXPECTED_COMMERCIAL_VERSION: ${EXPECTED_COMMERCIAL_VERSION:-2026-11-18}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # La FAQ envía el corpus completo; sin esta ventana Ollama recorta el prompt.
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      # Los embeddings del RAG se calculan en el servicio `ollama`. Si usas un
      # Ollama externo, define OLLAMA_BASE_URL en el .env del servidor.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      # El RAG evaluado del M2 consulta Qdrant; Postgres sigue siendo la
      # fuente de verdad relacional y el backend de memoria del agente.
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-carvajal_chunks}
      QDRANT_DIMENSIONS: ${QDRANT_DIMENSIONS:-768}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.30}
      AGENT_CHECKPOINTER: ${AGENT_CHECKPOINTER:-postgres}
      # Spec 044: modo del agente (tools por defecto; routes = enrutador por reglas)
      # y límites por turno del modo tools. tools solo arranca con LLM_PROVIDER=deepseek
      # y DEEPSEEK_API_KEY; si no, los turnos siguen por routes.
      AGENT_MODE: ${AGENT_MODE:-tools}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-4}
      AGENT_TURN_TIMEOUT_S: ${AGENT_TURN_TIMEOUT_S:-45}
      AGENT_MAX_QUOTES: ${AGENT_MAX_QUOTES:-3}
      # Obligatorio: sin él, cualquiera podría firmar cookies con una clave
      # conocida. Compose falla con un mensaje claro si falta o está vacío.
      SESSION_SECRET: "${SESSION_SECRET:?Define SESSION_SECRET en el .env del servidor}"
      # URL pública de la web para los enlaces firmados al PDF de una cotización
      # (WhatsApp). Vacía: el canal no ofrece el PDF. Ej.: http://203.0.113.10:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Token de operador para carga y captura web. Vacío deshabilita la
      # escritura web y deja solo la CLI interna. `CONFIG_TOKEN` sigue siendo
      # un alias aceptado por Settings.
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      # Captura web solo para operadores. El máximo por ejecución lo deriva
      # Settings de las semillas (24 por defecto); aquí solo se ajustan el
      # valor inicial, el tamaño y el timeout.
      CAPTURE_DEFAULT_URLS: ${CAPTURE_DEFAULT_URLS:-5}
      CAPTURE_MAX_BYTES: ${CAPTURE_MAX_BYTES:-5000000}
      CAPTURE_TIMEOUT_SECONDS: ${CAPTURE_TIMEOUT_SECONDS:-30}
      CAPTURE_MAX_REDIRECTS: ${CAPTURE_MAX_REDIRECTS:-5}
      # Límite por IP del endpoint público de captura.
      CAPTURE_REQUESTS_LIMIT: ${CAPTURE_REQUESTS_LIMIT:-5}
      CAPTURE_WINDOW_SECONDS: ${CAPTURE_WINDOW_SECONDS:-3600}
      # Allowlist opcional de dominios separados por coma. Vacía = cualquier
      # host público que pase el guard SSRF.
      CAPTURE_ALLOWED_DOMAINS: ${CAPTURE_ALLOWED_DOMAINS:-}
      # Cuota diaria por visitante (W4.2); la medianoche se calcula en la zona
      # indicada, no en el TZ del contenedor.
      DAILY_REQUESTS_LIMIT: ${DAILY_REQUESTS_LIMIT:-20}
      QUOTA_TIMEZONE: ${QUOTA_TIMEZONE:-America/Bogota}
      # Observabilidad (W6.3): logs JSON en stdout y Sentry solo si hay DSN.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-produccion}
      # Muestreo de trazas de Sentry entre 0 y 1; por defecto apagado.
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      # Monitoreo del agente con LangSmith (spec 038): apagado por defecto y,
      # en producción, solo metadatos. Se inyecta explícitamente para que una
      # variable heredada del host no encienda el tracing global.
      MONITORING_ENABLED: ${MONITORING_ENABLED:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-carvajal}
      # Identidad del agente en la traza; vacío no añade la clave.
      LANGSMITH_AGENT_ID: ${LANGSMITH_AGENT_ID:-}
      LANGSMITH_AGENT_ENVIRONMENT: ${LANGSMITH_AGENT_ENVIRONMENT:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      MONITORING_SAMPLE_RATE: ${MONITORING_SAMPLE_RATE:-0.2}
      MONITORING_INCLUDE_CONTENT: ${MONITORING_INCLUDE_CONTENT:-false}
      MONITORING_TIMEOUT_MS: ${MONITORING_TIMEOUT_MS:-2000}
      # El tracing global de LangChain queda apagado: el encendido es por turno.
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      # Sin proxy delante, uvicorn no debe confiar en X-Forwarded-* de los
      # clientes. Si añades nginx/Caddy en el host o en un contenedor, ajusta
      # esta variable a su IP o subred.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      # Demo por IP: la app se publica directamente en 0.0.0.0:APP_PORT.
      # Para TLS con dominio, publica solo en 127.0.0.1 y pon el proxy delante.
      - "0.0.0.0:${APP_PORT:-8080}:8000"
    # El código y los estáticos son de solo lectura; /app/data es el volumen
    # persistente donde viven Bronze, Silver, Gold y el índice de las cargas.
    read_only: true
    volumes:
      - appdata:/app/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 10s
    healthcheck:
      # Aquí sí se comprueba la base: es la preparación para servir tráfico real.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mcp:
    # Perfil `whatsapp`: servidor MCP que atiende WhatsApp (OpenClaw) con el mismo
    # agente del chat. No arranca en un despliegue normal: se activa con
    # COMPOSE_PROFILES=whatsapp y MCP_TOKEN en el .env del servidor, y desde ahí
    # `deploy.sh` lo actualiza con la misma imagen que `app`.
    # Se publica SOLO en el loopback del host; OpenClaw llega por un túnel SSH
    # restringido a este puerto (docs/whatsapp-openclaw.md).
    profiles: ["whatsapp"]
    image: ${APP_IMAGE:-carvajal-api:local}
    restart: unless-stopped
    command: ["python", "-m", "apps.mcp"]
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      <<: *app-environment
      # Bearer obligatorio de /mcp. Sin él el proceso termina con un mensaje claro.
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:8765"
    read_only: true
    volumes:
      - appdata:/app/data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/live', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage

  ollama:
    # Solo se usa para embeddings (nomic-embed-text); el LLM puede ser DeepSeek.
    # El modelo se descarga aparte: docker compose exec ollama ollama pull nomic-embed-text
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  ollama-pull:
    # Perfil `bootstrap`: descarga el modelo de embeddings. Solo se ejecuta a
    # demanda (`make prod-bootstrap`); con los modelos ya presentes termina en
    # segundos. El LLM de chat, si LLM_PROVIDER=ollama, se descarga aparte
    # (`docker compose -f compose.prod.yml exec ollama ollama pull <modelo>`).
    profiles: ["bootstrap"]
    image: ollama/ollama:0.40.16
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull nomic-embed-text
    depends_on:
      ollama:
        condition: service_healthy

  bootstrap:
    # Perfil `bootstrap`: prepara un servidor limpio o actualiza uno existente.
    # Siembra los archivos ausentes de `./data` (catálogo, comercial y Gold) sin
    # pisar los que ya viven en el volumen, aplica migraciones, importa Gold e
    # indexa en Qdrant. Es idempotente y lo invoca `make prod-bootstrap`.
    profiles: ["bootstrap"]
    image: ${APP_IMAGE:-carvajal-api:local}
    restart: "no"
    environment: *app-environment
    volumes:
      - appdata:/app/data
      # Corpus de referencia del despliegue; el volumen sigue siendo la fuente
      # de verdad una vez que hay cargas o recapturas.
      - ./data:/seed:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -c
      - |
        set -e
        seed_dir() {
          src="$$1"; dest="$$2"
          if [ -d "$$src" ]; then
            mkdir -p "$$dest"
            # Copia solo archivos ausentes: una actualización conserva lo que
            # ya vive en el volumen y añade el aprovisionamiento nuevo.
            find "$$src" -type f | while IFS= read -r file; do
              rel="$${file#$$src/}"
              target="$$dest/$$rel"
              if [ ! -e "$$target" ]; then
                mkdir -p "$$(dirname "$$target")"
                cp "$$file" "$$target"
              fi
            done
          fi
        }
        mkdir -p /app/data
        # Aprovisionamiento comercial y Gold son pasos separados: actualizar
        # precios o sedes no reescribe el corpus y viceversa.
        if [ -d /seed ]; then
          seed_dir /seed/catalog /app/data/catalog
          seed_dir /seed/commercial /app/data/commercial
          seed_dir /seed/gold /app/data/gold
        fi
        # El aprovisionamiento incluido en la imagen cubre actualizaciones
        # desde volúmenes de la 042 que aún no tienen proveedores.csv.
        if [ -d /app/seed-data ]; then
          seed_dir /app/seed-data/catalog /app/data/catalog
          seed_dir /app/seed-data/commercial /app/data/commercial
        fi
        ACTUAL="$$(python -m carvajal.commercial version)"
        if [ -n "$${EXPECTED_COMMERCIAL_VERSION:-}" ] && [ "$$ACTUAL" != "$$EXPECTED_COMMERCIAL_VERSION" ]; then
          echo "Catálogo comercial $$ACTUAL; se esperaba $$EXPECTED_COMMERCIAL_VERSION." >&2
          exit 1
        fi
        python -m carvajal.commercial validar
        alembic upgrade head
        carvajal migrate-gold
        carvajal index-qdrant
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully

volumes:
  appdata:
  pgdata:
  qdrantdata:
  ollamadata:
