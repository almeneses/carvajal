# App web + Postgres 16 con pgvector para una sola máquina (W6.1).
#
#   export SESSION_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
#   docker compose -f compose.prod.yml up -d --build
#   docker compose -f compose.prod.yml logs -f app
#
# O define SESSION_SECRET en el `.env` del servidor. Compose falla si no está:
# una clave HMAC conocida permitiría falsificar la cookie del visitante.
#
# Las migraciones se aplican aparte, antes de la primera petición real:
#   docker compose -f compose.prod.yml run --rm app alembic upgrade head
#
# El proxy con TLS y el runbook completo llegan en W6.2.

name: carvajal-prod

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carvajal}
      # Cámbiala en el .env del servidor: el valor por defecto es de desarrollo.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carvajal}
      POSTGRES_DB: ${POSTGRES_DB:-carvajal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
    image: carvajal-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      # Dentro de la red de compose el host de la base es el servicio `db`,
      # no loopback: por eso la URL se compone aquí a partir de POSTGRES_*.
      DATABASE_URL: postgresql://${POSTGRES_USER:-carvajal}:${POSTGRES_PASSWORD:-carvajal}@db:5432/${POSTGRES_DB:-carvajal}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      # El RAG evaluado del M2 consulta Qdrant; Postgres sigue siendo la
      # fuente de verdad relacional y el backend de memoria del agente.
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-carvajal_chunks}
      AGENT_CHECKPOINTER: ${AGENT_CHECKPOINTER:-postgres}
      # Obligatorio: sin él, cualquiera podría firmar cookies con una clave
      # conocida. Compose falla con un mensaje claro si falta o está vacío.
      SESSION_SECRET: "${SESSION_SECRET:?Define SESSION_SECRET en el .env del servidor}"
      # Cuota diaria por visitante (W4.2); la medianoche se calcula en la zona
      # indicada, no en el TZ del contenedor.
      DAILY_REQUESTS_LIMIT: ${DAILY_REQUESTS_LIMIT:-20}
      QUOTA_TIMEZONE: ${QUOTA_TIMEZONE:-America/Bogota}
      # Observabilidad (W6.3): logs JSON en stdout y Sentry solo si hay DSN.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-produccion}
      # Muestreo de trazas de Sentry entre 0 y 1; por defecto apagado.
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      # W6.2 termina TLS en el proxy y reenvía X-Forwarded-Proto. Uvicorn solo
      # confía en estas IPs (por defecto 127.0.0.1); si el proxy es otro
      # contenedor de la red de compose, añade su dirección o la subred.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      # Solo loopback: el proxy de W6.2 es el que expone el puerto público.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    # La app solo lee código, plantillas y estáticos: no necesita escribir en
    # el sistema de archivos ni privilegios adicionales.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 10s
    healthcheck:
      # Aquí sí se comprueba la base: es la preparación para servir tráfico real.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
