[project]
name = "carvajal"
version = "0.1.0"
description = "Pipeline de captura y curaduría del corpus web de Carvajal para RAG."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Marko David Garcia", email = "markodavidgm@gmail.com" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "markdown>=3.11.3",
    "nh3>=0.3.7",
    "ollama>=0.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.15,<1.16",
    "sentry-sdk>=2.75.0",
    "sqlalchemy>=2.0.36",
    "structlog>=26.1.0",
    "tzdata>=2025.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Captura y curaduría del corpus: solo las usa la CLI (HTTP y extracción HTML).
capture = [
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "requests>=2.32",
]
# Prototipo Streamlit y consulta con FAISS. La app web no los importa; W7.1 los
# retira. En desarrollo, CI y para usar la CLI completa se instalan con
# `uv sync --all-extras`.
legacy = [
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.10",
    "langchain-anthropic>=1.7.7",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=0.3",
    "streamlit>=1.66.1",
]

[project.urls]
Homepage = "https://github.com/markodavid/carvajal"
Repository = "https://github.com/markodavid/carvajal"
Issues = "https://github.com/markodavid/carvajal/issues"

[project.scripts]
carvajal = "carvajal.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Monorepo: el paquete vive en packages/core para dejar sitio a apps/ y otros
# paquetes sin mover el código otra vez.
module-name = "carvajal"
module-root = "packages/core/src"

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3",
    "ruff>=0.8.0",
    "testcontainers>=4.9",
    "ty>=0.0.95",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/core/src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "carvajal"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: requiere Postgres real vía testcontainers",
]
