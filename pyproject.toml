[project]
name = "carvajal"
version = "0.1.0"
description = "Pipeline de captura y curaduría del corpus web de Carvajal para RAG."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Marko David Garcia", email = "markodavidgm@gmail.com" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.162.4",
    "fpdf2>=2.8,<3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=0.3",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langsmith>=0.14.14",
    "markdown>=3.11.3",
    "mcp>=2.3,<3",
    "nh3>=0.3.7",
    "ollama>=0.6",
    "pillow>=13,<14",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.15,<1.16",
    "sentry-sdk>=2.75.0",
    "sqlalchemy>=2.0.36",
    "structlog>=26.1.0",
    "tzdata>=2025.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Captura y curaduría del corpus: solo las usa la CLI (HTTP y extracción HTML).
capture = [
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "requests>=2.32",
]
# Consulta con FAISS que usa la CLI histórica (ask, summarize, faq, eval). La
# app web no la importa. En desarrollo, CI y para usar la CLI completa se
# instalan con `uv sync --all-extras`.
legacy = [
    "faiss-cpu>=1.16.0",
    "langchain>=1.4.10",
    "langchain-anthropic>=1.7.7",
    "langchain-community>=0.4.2",
]

[project.urls]
Homepage = "https://github.com/markodavid/carvajal"
Repository = "https://github.com/markodavid/carvajal"
Issues = "https://github.com/markodavid/carvajal/issues"

[project.scripts]
carvajal = "carvajal.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Monorepo: el paquete vive en packages/core para dejar sitio a apps/ y otros
# paquetes sin mover el código otra vez.
module-name = "carvajal"
module-root = "packages/core/src"

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3",
    "ruff>=0.8.0",
    "testcontainers>=4.9",
    "ty>=0.0.100",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/core/src", "apps", "tests"]
# `.dsh/` lo crea la herramienta de agentes con sus propios repos vendorizados.
extend-exclude = [".dsh"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "carvajal"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: requiere Postgres real vía testcontainers",
    "smoke: comprobación rápida del monitoreo, sin credenciales ni red",
    "e2e: extremo a extremo con servicios reales y LangSmith (excluido de make check)",
]

[tool.ty.src]
exclude = [".dsh"]
