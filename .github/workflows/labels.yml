name: Sync Labels
description: Sincroniza las etiquetas declaradas en .github/labels.yml con el repositorio.

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sincronizar etiquetas
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sync: true
