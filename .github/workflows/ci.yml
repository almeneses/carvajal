name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Presupuesto de cambios
        # Falla si el PR supera el límite duro; advierte desde el blando.
        # Sin dependencias: corre antes de instalar el entorno.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOFT_LIMIT: "300"
          HARD_LIMIT: "700"
        run: python3 .github/scripts/pr_size.py

      - name: Instalar uv
        # v8+ ya no publica tags de version mayor: se fija la version completa.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar entorno
        run: uv sync --all-groups

      - name: Pre-commit (higiene + Ruff + uv-lock)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Verificación de tipos (ty)
        run: uv run ty check

      - name: Pruebas
        run: uv run pytest

  db:
    name: Base de datos
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: carvajal
          POSTGRES_PASSWORD: carvajal
          POSTGRES_DB: carvajal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carvajal -d carvajal"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cliente de Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validar compose.yml
        run: docker compose config -q

      - name: Verificar Postgres y pgvector
        env:
          DATABASE_URL: postgresql://carvajal:carvajal@localhost:5432/carvajal
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
          version=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "SELECT extversion FROM pg_extension WHERE extname = 'vector';")
          echo "pgvector $version"
          test -n "$version" || { echo "::error::La extensión vector no está disponible"; exit 1; }
