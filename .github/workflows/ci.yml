name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Presupuesto de cambios
        # Falla si el PR supera el límite duro; advierte desde el blando.
        # Sin dependencias: corre antes de instalar el entorno.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOFT_LIMIT: "300"
          HARD_LIMIT: "700"
        run: python3 .github/scripts/pr_size.py

      - name: Instalar uv
        # v8+ ya no publica tags de version mayor: se fija la version completa.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar entorno
        run: uv sync --all-groups

      - name: Pre-commit (higiene + Ruff + uv-lock)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Verificación de tipos (ty)
        run: uv run ty check

      - name: Pruebas
        run: uv run pytest
