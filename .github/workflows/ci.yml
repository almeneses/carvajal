name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Presupuesto de cambios
        # Solo advierte por encima de 3.000 líneas; no falla ni bloquea el merge.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WARN_LIMIT: "3000"
        run: python3 .github/scripts/pr_size.py

      - name: Instalar uv
        # v8+ ya no publica tags de version mayor: se fija la version completa.
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar entorno
        run: uv sync --all-groups --all-extras

      - name: Pre-commit (higiene + Ruff + uv-lock)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Verificación de tipos (ty)
        run: uv run ty check

      - name: Pruebas
        run: uv run pytest -m "not integration and not e2e and not smoke"

      - name: Node 24.16.0
        # Los dobles de voz (spec 040) usan el runner de Node y sus APIs del
        # navegador simuladas; no instalan dependencias npm ni piden micrófono.
        uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"

      - name: Pruebas JavaScript del chat
        run: node --test tests/js/*.cjs

      - name: Smoke del monitoreo
        run: uv run pytest -m "smoke and not integration and not e2e"

  integration:
    name: Integración
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar entorno
        run: uv sync --all-groups --all-extras

      - name: Pruebas de integración
        # testcontainers usa el Docker del runner; sin pruebas marcadas aún, no falla.
        run: |
          if grep -rq "pytest.mark.integration" tests; then
            uv run pytest -m integration
          else
            echo "Sin pruebas de integración todavía."
          fi

  db:
    name: Base de datos
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: carvajal
      POSTGRES_PASSWORD: carvajal
      POSTGRES_DB: carvajal
      POSTGRES_PORT: 5432
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cliente de Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validar compose.yml
        # Sin perfil: db + qdrant (flujo nativo). Con `full`: app, Ollama y
        # bootstrap, que es lo que usa `make up`.
        run: |
          docker compose config -q
          docker compose --profile full config -q

      - name: Levantar la base
        run: docker compose up -d --wait --wait-timeout 60 db

      - name: Verificar Postgres y pgvector
        env:
          DATABASE_URL: postgresql://carvajal:carvajal@127.0.0.1:5432/carvajal
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
          version=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "SELECT extversion FROM pg_extension WHERE extname = 'vector';")
          echo "pgvector $version"
          test -n "$version" || { echo "::error::La extensión vector no está disponible"; exit 1; }

      - name: Bajar la base
        if: always()
        run: docker compose down -v
