# Revisión automática de pull requests con DeepSeek.
#
# Requiere el secreto DEEPSEEK_API_KEY (Settings → Secrets and variables →
# Actions). Sin ese secreto el job no falla: se omite con un aviso.
# Opcionales (variables, no secretos):
#   DEEPSEEK_MODEL     por defecto deepseek-flash (DeepSeek-V4.1-Flash-1017)
#   DEEPSEEK_THINKING  enabled para activar el razonamiento (más caro y lento)
#   DEEPSEEK_EFFORT    low | high | max, solo si THINKING=enabled
#
# Es una ayuda, no un gate: no bloquea el merge ni sustituye la revisión humana.
#
# Identidad de los comentarios:
#   Sin configurar  → aparecen como "github-actions[bot]".
#   Con la GitHub App de Dippy → aparecen con su nombre y avatar.
#   Para activarla: variable DIPPY_APP_ID y secreto DIPPY_PRIVATE_KEY.

name: AI Review (DeepSeek)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       github.event.comment.body == '@dippy review' &&
       github.event.comment.user.type == 'User' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    concurrency:
      group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar el PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          if jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$EVENT_HEAD" '
            .state == "open" and (.draft | not) and .head.repo.full_name == $repo and
            .user.login != "dependabot[bot]" and ($head == "" or .head.sha == $head)
          ' "$RUNNER_TEMP/pr.json" > /dev/null; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      # El revisor viene de la rama por defecto. El código del PR solo se lee como diff.
      - name: Checkout de confianza
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generar diff del PR
        if: steps.pr.outputs.eligible == 'true'
        run: |
          base=$(jq -er .base.sha "$RUNNER_TEMP/pr.json")
          head=$(jq -er .head.sha "$RUNNER_TEMP/pr.json")
          git fetch --no-tags origin "$base" "$head"
          git -c core.quotePath=false diff --no-color --no-ext-diff --no-textconv "$base...$head" \
            -- . ':(exclude)uv.lock' ':(exclude)**/*.lock' ':(exclude)data/**' \
            > "$RUNNER_TEMP/pr.diff"
          echo "Tamaño del diff: $(wc -c < "$RUNNER_TEMP/pr.diff") bytes"

      - name: Comprobar la clave de API
        id: config
        if: steps.pr.outputs.eligible == 'true'
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice title=AI Review::DEEPSEEK_API_KEY sin configurar; se omite la revisión."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Token de Dippy (GitHub App, opcional)
        # Si aún no existe la app, se sigue usando github.token y los
        # comentarios aparecen como "github-actions[bot]".
        id: dippy
        if: steps.config.outputs.enabled == 'true' && vars.DIPPY_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DIPPY_APP_ID }}
          private-key: ${{ secrets.DIPPY_PRIVATE_KEY }}

      - name: Revisar con DeepSeek
        if: steps.config.outputs.enabled == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          DEEPSEEK_THINKING: ${{ vars.DEEPSEEK_THINKING || 'disabled' }}
          DEEPSEEK_EFFORT: ${{ vars.DEEPSEEK_EFFORT || 'high' }}
          GITHUB_TOKEN: ${{ steps.dippy.outputs.token || github.token }}
        run: |
          PR_NUMBER=$(jq -er .number "$RUNNER_TEMP/pr.json")
          PR_HEAD_SHA=$(jq -er .head.sha "$RUNNER_TEMP/pr.json")
          PR_TITLE=$(jq -r .title "$RUNNER_TEMP/pr.json")
          PR_BODY=$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json")
          export PR_NUMBER PR_HEAD_SHA PR_TITLE PR_BODY
          args=()
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            args+=(--manual)
          fi
          python3 .github/scripts/ai_review.py --diff "$RUNNER_TEMP/pr.diff" "${args[@]}"
