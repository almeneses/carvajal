# Revisión automática de pull requests con DeepSeek.
#
# Requiere el secreto DEEPSEEK_API_KEY (Settings → Secrets and variables →
# Actions). Sin ese secreto el job no falla: se omite con un aviso.
# Opcional: la variable DEEPSEEK_MODEL ajusta el modelo (por defecto deepseek-chat).
#
# Es una ayuda, no un gate: no bloquea el merge ni sustituye la revisión humana.

name: AI Review (DeepSeek)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisar:
    # Se omite en borradores, en PRs de Dependabot (bumps triviales) y en forks,
    # donde Actions no expone secretos.
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generar diff del PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-color "$BASE_SHA...$HEAD_SHA" \
            -- . ':(exclude)uv.lock' ':(exclude)**/*.lock' ':(exclude)data/**' \
            > "$RUNNER_TEMP/pr.diff"
          echo "Tamaño del diff: $(wc -c < "$RUNNER_TEMP/pr.diff") bytes"

      - name: Comprobar la clave de API
        id: config
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice title=AI Review::DEEPSEEK_API_KEY sin configurar; se omite la revisión."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Revisar con DeepSeek
        if: steps.config.outputs.enabled == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/ai_review.py --diff "$RUNNER_TEMP/pr.diff"
