# Postgres 16 con pgvector para el desarrollo local de la app web.
#
#   make db        levanta la base y espera al healthcheck
#   make db-down   la detiene (los datos quedan en el volumen pgdata)
#
# La cadena de conexión se deriva de las variables POSTGRES_* (ver
# .env.example): el puerto del host es POSTGRES_PORT y dentro del contenedor
# Postgres siempre escucha en 5432.

name: carvajal

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carvajal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carvajal}
      POSTGRES_DB: ${POSTGRES_DB:-carvajal}
    ports:
      # Puerto del host (configurable) → 5432 fijo dentro del contenedor.
      # Solo en loopback: la base es local y sus credenciales son de desarrollo.
      # En CI el runner también la alcanza por loopback.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Se ejecuta dentro del contenedor, donde Postgres escucha en 5432. El
      # doble $ deja que el shell del contenedor expanda sus propias variables,
      # que son las del bloque environment de arriba.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  whisper:
    # Speaches ejecuta faster-whisper y expone la API compatible con OpenAI.
    # El puerto 9000 es solo para que la API del host lo alcance en desarrollo;
    # el modelo se descarga en el primer arranque y queda en whisperdata.
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    restart: unless-stopped
    environment:
      ENABLE_UI: "false"
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      # Mantiene el modelo en memoria entre dictados (la caché ya está en disco).
      WHISPER__TTL: "-1"
    ports:
      - "127.0.0.1:9000:8000"
    volumes:
      - whisperdata:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  whisper-init:
    # Speaches 0.8.x no precarga al arrancar: este contenedor de un solo uso
    # descarga el modelo en el volumen compartido antes de la primera pregunta.
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    depends_on:
      whisper:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        curl -fsS --retry 5 --retry-delay 5 -X POST
        http://whisper:8000/v1/models/${TRANSCRIPTION_MODEL:-Systran/faster-whisper-small}
    volumes:
      - whisperdata:/home/ubuntu/.cache/huggingface/hub

volumes:
  pgdata:
  qdrantdata:
  whisperdata:
