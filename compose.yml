# Stack local de Carvajal.
#
# Dos formas de usarlo, sin perfiles de por medio para lo de siempre:
#
#   make db        Postgres 16 + pgvector (servicio db)
#   make qdrant    Qdrant con volumen persistente (servicio qdrant)
#   make api       app nativa con `uv` contra esos dos servicios
#
# y, para no instalar nada en el host más allá de Docker:
#
#   make up        stack completo: db + qdrant + ollama + app + corpus
#   make down      lo detiene conservando los volúmenes
#
# `make up` activa el perfil `full`: la app en modo desarrollo (recarga y
# directorios del repo montados), Ollama con el modelo de embeddings y un
# servicio de preparación de una sola ejecución que aplica migraciones, importa
# el corpus Gold a Postgres y lo indexa en Qdrant. Sin el perfil, el archivo se
# comporta como antes: solo db y qdrant.
#
# La cadena de conexión se deriva de las variables POSTGRES_* (ver
# .env.example): el puerto del host es POSTGRES_PORT y dentro del contenedor
# Postgres siempre escucha en 5432.

name: carvajal

# Configuración compartida por la app de desarrollo y el servicio de arranque.
x-dev-app: &dev-app
  build:
    context: .
    # Etapa de desarrollo del Dockerfile: venv con el extra `capture`, recarga
    # y sin usuario fijo (Compose lo baja al UID del host con LOCAL_UID).
    target: dev
  image: carvajal-api:dev
  environment: &dev-environment
    # Dentro de la red de Compose los hosts son los nombres de los servicios.
    DATABASE_URL: postgresql://${POSTGRES_USER:-carvajal}:${POSTGRES_PASSWORD:-carvajal}@db:5432/${POSTGRES_DB:-carvajal}
    QDRANT_URL: http://qdrant:6333
    QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    QDRANT_COLLECTION: ${QDRANT_COLLECTION:-carvajal_chunks}
    QDRANT_DIMENSIONS: ${QDRANT_DIMENSIONS:-768}
    QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
    # LLM del chat en la nube (DeepSeek) por defecto: Ollama queda solo para los
    # embeddings. Sin DEEPSEEK_API_KEY el chat degrada a routes y la app lo avisa al
    # arrancar (llm.provider_unconfigured). LLM_PROVIDER=ollama vuelve al chat local.
    LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
    OLLAMA_BASE_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5}
    AGENT_CHECKPOINTER: ${AGENT_CHECKPOINTER:-postgres}
    # Spec 044: modo del agente (tools por defecto; routes = enrutador por reglas)
    # y límites por turno del modo tools. tools solo arranca con LLM_PROVIDER=deepseek
    # y DEEPSEEK_API_KEY; si no, los turnos siguen por routes.
    AGENT_MODE: ${AGENT_MODE:-tools}
    AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-4}
    AGENT_TURN_TIMEOUT_S: ${AGENT_TURN_TIMEOUT_S:-45}
    AGENT_MAX_QUOTES: ${AGENT_MAX_QUOTES:-4}
    RAG_TOP_K: ${RAG_TOP_K:-6}
    RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.30}
    DAILY_REQUESTS_LIMIT: ${DAILY_REQUESTS_LIMIT:-20}
    QUOTA_TIMEZONE: ${QUOTA_TIMEZONE:-America/Bogota}
    CAPTURE_DEFAULT_URLS: ${CAPTURE_DEFAULT_URLS:-5}
    CAPTURE_MAX_BYTES: ${CAPTURE_MAX_BYTES:-5000000}
    CAPTURE_TIMEOUT_SECONDS: ${CAPTURE_TIMEOUT_SECONDS:-30}
    CAPTURE_MAX_REDIRECTS: ${CAPTURE_MAX_REDIRECTS:-5}
    CAPTURE_REQUESTS_LIMIT: ${CAPTURE_REQUESTS_LIMIT:-5}
    CAPTURE_WINDOW_SECONDS: ${CAPTURE_WINDOW_SECONDS:-3600}
    CAPTURE_ALLOWED_DOMAINS: ${CAPTURE_ALLOWED_DOMAINS:-}
    # Determinista para que la recarga no invalide la cookie del visitante.
    SESSION_SECRET: ${SESSION_SECRET:-dev-carvajal-inseguro-solo-local}
    # Token de operador para la carga y captura web; vacío las deshabilita.
    OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
    # Webhook firmado de mensajería (docs/webhooks.md). Sin secreto responde 404; la
    # allowlist E.164 separada por comas vacía rechaza todos los remitentes.
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    WEBHOOK_ALLOWED_NUMBERS: ${WEBHOOK_ALLOWED_NUMBERS:-}
    # Jev (spec 046) y fotos de alimentos (spec 051) con las mismas variables que
    # producción: sin TYPESAFE_API_KEY quedan apagados y el ensayo los salta.
    JEV_ENABLED: ${JEV_ENABLED:-false}
    TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    JEV_MODEL: ${JEV_MODEL:-jev-1.14.0}
    FOOD_PHOTO_ENABLED: ${FOOD_PHOTO_ENABLED:-true}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # El perfil local no envía nada a Sentry ni a LangSmith salvo que se pida.
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    MONITORING_ENABLED: ${MONITORING_ENABLED:-false}
    LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    MONITORING_SAMPLE_RATE: ${MONITORING_SAMPLE_RATE:-0.2}
    MONITORING_INCLUDE_CONTENT: ${MONITORING_INCLUDE_CONTENT:-false}
    LANGSMITH_TRACING: "false"
    LANGCHAIN_TRACING_V2: "false"
  volumes: &dev-volumes
    # El código se edita en el host y la app lo recarga; `data/` es el corpus.
    - ./apps:/app/apps
    - ./packages/core/src:/app/packages/core/src
    - ./migrations:/app/migrations
    - ./alembic.ini:/app/alembic.ini:ro
    - ./data:/app/data
  # Sin esto los archivos que escribe la app en `./data` quedarían de root.
  # `make up` exporta los IDs reales; el valor por defecto cubre Linux.
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  init: true
  stop_grace_period: 10s

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carvajal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carvajal}
      POSTGRES_DB: ${POSTGRES_DB:-carvajal}
    ports:
      # Puerto del host (configurable) → 5432 fijo dentro del contenedor.
      # Solo en loopback: la base es local y sus credenciales son de desarrollo.
      # En CI el runner también la alcanza por loopback.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Se ejecuta dentro del contenedor, donde Postgres escucha en 5432. El
      # doble $ deja que el shell del contenedor expanda sus propias variables,
      # que son las del bloque environment de arriba.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    # La imagen de Qdrant no trae curl ni wget, pero sí bash: el healthcheck abre /readyz
    # por /dev/tcp (200 cuando todas las colecciones cargaron). Los servicios que buscan en el
    # índice esperan a que esté sano en vez de solo arrancado.
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ollama:
    # Solo dentro de `make up`: embeddings (y el chat solo si LLM_PROVIDER=ollama).
    # No publica el puerto: la app nativa (`make api`) sigue usando el Ollama
    # del host en 127.0.0.1:11434, y publicarlo aquí chocaría con él. Para
    # exponerlo, añade `ports: ["127.0.0.1:11434:11434"]` a este servicio.
    profiles: ["full"]
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-pull:
    # Descarga los modelos que el stack necesita: siempre el de embeddings y el de
    # chat solo si LLM_PROVIDER=ollama. Es idempotente: si ya están en el volumen,
    # la comprobación termina en segundos.
    profiles: ["full"]
    image: ollama/ollama:0.40.16
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull nomic-embed-text &&
        if [ "${LLM_PROVIDER:-deepseek}" = "ollama" ]; then
        ollama pull "${OLLAMA_MODEL:-llama3.2}"; fi
    depends_on:
      ollama:
        condition: service_healthy

  bootstrap:
    # Una sola ejecución: deja Postgres con el esquema y el corpus, y Qdrant
    # indexado. Es idempotente, así que repetir `make up` no duplica nada.
    profiles: ["full"]
    <<: *dev-app
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        alembic upgrade head
        carvajal migrate-gold
        carvajal index-qdrant
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  app:
    profiles: ["full"]
    <<: *dev-app
    restart: unless-stopped
    ports:
      # Loopback y puerto fijo: la app nativa también usa 8000.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Perfil `whatsapp` (ensayo, docs/ensayo.md): el servidor MCP que en producción
  # atiende a OpenClaw, con el mismo agente que el chat. Solo en el loopback.
  # `make up PERFILES="full whatsapp"`; las fotos de WhatsApp se leen de
  # ./data/openclaw-media (el «inbound» de OpenClaw en local).
  mcp:
    profiles: ["whatsapp"]
    <<: *dev-app
    restart: unless-stopped
    command: ["python", "-m", "apps.mcp"]
    environment:
      <<: *dev-environment
      MCP_TOKEN: ${MCP_TOKEN:-dev-mcp-solo-local}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
      FOOD_PHOTO_MEDIA_DIR: /app/data/openclaw-media
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/live', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  qdrantdata:
  ollamadata:
