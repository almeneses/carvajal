# Configuración de Alembic para el esquema relacional de Carvajal.
#
#   uv run alembic upgrade head
#   uv run alembic downgrade base
#
# La URL real no se guarda aquí: migrations/env.py la toma de DATABASE_URL o,
# si no existe, de Settings().database_url.

[alembic]
script_location = migrations
prepend_sys_path = packages/core/src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
