    <rect x="146" y="316" width="8" height="18" rx="3"/>
    <rect x="370" y="316" width="8" height="18" rx="3"/>
    <rect x="384" y="316" width="8" height="18" rx="3"/>
    <rect x="398" y="316" width="8" height="18" rx="3"/>
