  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- cola -->
  <path d="M96 300 C56 268 44 232 52 206 C78 224 104 244 118 262 Z" fill="#2f5fb3"/>
  <path d="M104 356 C66 372 44 366 28 350 C58 344 82 340 100 336 Z" fill="#2f5fb3"/>

