{% if current_user %}
<li class="navegacion-usuario">{{ current_user.name }}</li>
<li>
  <form class="form-salir" method="post" action="/auth/logout">
    {% include "_csrf.html" %}
    <button type="submit">Salir</button>
  </form>
</li>
{% else %}
<li><a href="/auth/login">Entrar</a></li>
{% endif %}
