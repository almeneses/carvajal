<div class="traza" id="chat-traza" aria-live="polite" hidden>
  <span class="traza-item">Ruta: <strong data-campo="route"></strong></span>
  <span class="traza-item" data-campo="tool-wrap" hidden>Herramienta: <strong data-campo="tool"></strong></span>
  <span class="traza-item" data-campo="memory-wrap" hidden>Memoria: <strong data-campo="memory"></strong> preferencia(s)</span>
  <span class="traza-item">Hilo: <code data-campo="thread"></code></span>
</div>
<p id="chat-stream-estado" class="ayuda" role="status" aria-live="polite"></p>

<template id="plantilla-turno">
  <li class="turno">
    <p class="turno-rol"></p>
    <div class="burbuja">
      <p class="texto"></p>
    </div>
    <section class="citas" aria-label="Fuentes de la respuesta" hidden>
      <h3>Fuentes citadas</h3>
      <ol class="fuentes"></ol>
    </section>
  </li>
</template>

<template id="plantilla-fuente">
  <li class="fuente">
    <p class="fuente-meta">
      <span>Documento: <a data-campo="url" target="_blank" rel="noopener noreferrer"><strong data-campo="title"></strong></a></span>
      <span>Sección: <span data-campo="section"></span></span>
      <span>Capa: <span data-campo="layer"></span></span>
      <span>Tipo: <span data-campo="source_type"></span></span>
      <span class="puntuacion">Puntuación: <span data-campo="score"></span></span>
    </p>
    <p class="extracto" data-campo="excerpt"></p>
    <p class="chunk" data-campo="chunk_id"></p>
  </li>
</template>

<noscript>
  <p class="ayuda">
    El streaming en vivo necesita JavaScript; el formulario sigue funcionando y guarda la
    conversación igual.
  </p>
</noscript>
