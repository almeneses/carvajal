{% extends "base.html" %} {% block content %}
<h1>Pregunta al corpus Carvajal</h1>
<p class="entradilla">Respuestas con citas a partir de los documentos capturados del corpus.</p>

<form class="formulario" method="post" action="/ask" hx-post="/ask"
  hx-target="#respuesta" hx-swap="innerHTML">
  <label class="sr-only" for="pregunta">Pregunta</label>
  <input id="pregunta" name="question" type="text" required autocomplete="off"
    placeholder="¿Cuándo nació la empresa?" />
  <button type="submit">Preguntar</button>
</form>

<div id="respuesta" aria-live="polite" class="respuesta"></div>
{% endblock %}
