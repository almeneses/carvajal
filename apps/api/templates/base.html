<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Asistente Carvajal{% endblock %}</title>
    <meta
      name="description"
      content="Asistente del corpus público de Carvajal: respuestas con la fuente citada."
    />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <a class="saltar" href="#contenido">Saltar al contenido</a>
    <header class="cabecera">
      <div class="cabecera-interior">
        <a class="marca" href="/">
          <span class="marca-logo"><img src="/static/logo.svg" alt="Carvajal" /></span>
          <span class="marca-texto">Asistente del corpus</span>
        </a>
        <nav class="navegacion" aria-label="Secciones de la página">
          <ul>
            <li><a href="#preguntar">Preguntar</a></li>
            {% if answer is defined and answer %}
            <li><a href="#respuesta">Respuesta</a></li>
            {% endif %}
          </ul>
        </nav>
      </div>
    </header>
    <main id="contenido" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    <footer class="pie">
      <p>
        Respuestas basadas únicamente en el corpus público de Carvajal; cada una cita su fuente.
      </p>
    </footer>
    <script>
      // Sustituye a HTMX en este único formulario: envía la pregunta y pinta el parcial.
      document.addEventListener("submit", async (event) => {
        const form = event.target.closest("form[data-preguntar]");
        if (!form) return;
        event.preventDefault();
        const zona = document.getElementById("respuesta");
        zona.setAttribute("aria-busy", "true");
        try {
          const response = await fetch(form.action, { method: "POST", body: new FormData(form) });
          zona.innerHTML = await response.text();
        } catch {
          zona.innerHTML = '<p class="aviso">No se pudo contactar con el servicio.</p>';
        } finally {
          zona.removeAttribute("aria-busy");
          zona.scrollIntoView({ block: "nearest" });
        }
      });
    </script>
  </body>
</html>
